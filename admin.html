    </script>
    <style>
        :root {
            --primary: #1a5f7a;
            --primary-dark: #124c63;
            --secondary: #159895;
            --accent: #ffc107;
            --light: #f8f9fa;
            --dark: #2d3e50;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ff9800;
            --gray: #6c757d;
            --white: #ffffff;
            --card-bg: #ffffff;
            --border-radius: 8px;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e6f7ff 0%, #f0f9eb 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s ease;
        }

        .admin-container:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .admin-header {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .news-form-container {
            background: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .form-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .news-list {
            margin-top: 40px;
        }

        .news-list h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .news-item {
            background: var(--light);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }

        .news-item h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .news-meta {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .news-actions {
            display: flex;
            gap: 10px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            max-width: 350px;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .notification-success {
            border-left: 4px solid var(--success);
        }

        .notification-error {
            border-left: 4px solid var(--danger);
        }

        .notification-info {
            border-left: 4px solid var(--primary);
        }

        /* Login Styles */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e6f7ff 0%, #f0f9eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            margin-bottom: 30px;
        }

        .login-logo img {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        .login-logo h2 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .login-form .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .login-form input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .login-links {
            text-align: center;
        }

        .login-links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>HCA News Admin</h1>
            <div class="user-info">
                <div class="user-avatar">NA</div>
                <span>News Admin</span>
                <button class="logout-btn">Logout</button>
            </div>
        </div>

        <div class="news-form-container">
            <div class="form-title">Add New News Article</div>
            <form id="newsForm">
                <div class="form-group">
                    <label for="newsTitle">Title *</label>
                    <input type="text" id="newsTitle" name="newsTitle" required placeholder="Enter news title">
                </div>

                <div class="form-group">

                </div>

        </div>

        <div class="news-list">
            <h2>Recent News Articles</h2>
            <div id="newsList">
                <!-- News articles will be loaded here -->
            </div>

    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay" style="display: none;">
        <div class="login-container">
            <div class="login-logo">
                <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lWR0aD0iNDAiIGhlaWdodD0iNDAiIHJ4PSI4IiBmaWxsPSIjMDA3QTU1Ii8+CjxwYXRoIGQ9Ik0xMiAxMkgyOFYyOEgxMlYyOFoiIGZpbGw9IndoaXRlIi8+Cjwvc3ZnPgo=" alt="HCA Logo">

    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC-rfIMVhvTtOoCfy54TRKd_uBtV6Rm_BU",
            authDomain: "halal-cert-ba673.firebaseapp.com",
            projectId: "halal-cert-ba673",
            storageBucket: "halal-cert-ba673.firebasestorage.app",
            messagingSenderId: "134058623053",
            appId: "1:134058623053:web:383d36bc4f37081ab45c04",
            measurementId: "G-QF58M6YP7R"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDB = db;
        window.firebaseStorage = storage;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;

        // Global variables
        let currentUser = null;

        // Authentication state management
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // User is not authenticated, show login overlay
                showLoginOverlay();
            } else {
                // User is authenticated
                currentUser = user;
                hideLoginOverlay();
                updateUserInfo(user);
                loadNewsArticles();
            }
        });

        // Show login overlay
        function showLoginOverlay() {
            const overlay = document.getElementById('loginOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
            }
        }

        // Hide login overlay
        function hideLoginOverlay() {
            const overlay = document.getElementById('loginOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Handle admin login form submission
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorElement = document.getElementById('loginError');

            // Clear previous error
            errorElement.style.display = 'none';
            errorElement.textContent = '';

            try {
                // Use Firebase Authentication
                await signInWithEmailAndPassword(window.firebaseAuth, email, password);
                showNotification('Login successful! Welcome to the News Admin Panel.', 'success');
                hideLoginOverlay();
            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = 'Login failed. Please try again.';

                // Handle specific Firebase auth errors
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'No account found with this email address.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Incorrect password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Please enter a valid email address.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'This account has been disabled.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Too many failed login attempts. Please try again later.';
                        break;
                    default:
                        errorMessage = error.message || 'Login failed. Please try again.';
                }

                errorElement.textContent = errorMessage;
                errorElement.style.display = 'block';
            }
        });

        // Update user information in the UI
        function updateUserInfo(user) {
            const userNameElement = document.querySelector('.user-info span');
            const userAvatarElement = document.querySelector('.user-avatar');

            if (userNameElement) {
                if (user.displayName) {
                    userNameElement.textContent = user.displayName;
                } else if (user.email) {
                    userNameElement.textContent = user.email.split('@')[0];
                }
            }

            if (userAvatarElement) {
                if (user.displayName) {
                    userAvatarElement.textContent = user.displayName.charAt(0).toUpperCase();
                } else if (user.email) {
                    userAvatarElement.textContent = user.email.charAt(0).toUpperCase();
                }
            }
        }

        // Handle news form submission
        document.getElementById('newsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('newsTitle').value.trim();
            const excerpt = document.getElementById('newsExcerpt').value.trim();
            const content = document.getElementById('newsContent').value.trim();
            const date = document.getElementById('newsDate').value;
            const imageFile = document.getElementById('newsImage').files[0];

            if (!title || !excerpt || !content || !date) {
                showNotification('Please fill in all required fields.', 'error');
                return;
            }

            try {
                let imageUrl = null;

                // Upload image if provided
                if (imageFile) {
                    // Validate file size (5MB max)
                    if (imageFile.size > 5 * 1024 * 1024) {
                        showNotification('Image file size must be less than 5MB.', 'error');
                        return;
                    }

                    // Validate file type
                    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
                    if (!allowedTypes.includes(imageFile.type)) {
                        showNotification('Please upload a valid image file (JPG, PNG, or GIF).', 'error');
                        return;
                    }

                    // Create unique filename
                    const timestamp = Date.now();
                    const fileName = `news_${timestamp}_${imageFile.name}`;
                    const storageRef = window.ref(window.firebaseStorage, `news-images/${fileName}`);

                    // Upload file
                    const snapshot = await window.uploadBytes(storageRef, imageFile);
                    imageUrl = await window.getDownloadURL(snapshot.ref);
                }

                const newsData = {
                    title: title,
                    excerpt: excerpt,
                    content: content,
                    date: date,
                    image: imageUrl,
                    createdAt: new Date(),
                    updatedAt: new Date()
                };

                await window.addDoc(window.collection(window.firebaseDB, 'news'), newsData);

                showNotification('News article published successfully!', 'success');
                document.getElementById('newsForm').reset();

                // Set default date to today
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('newsDate').value = today;

                // Reload news list
                loadNewsArticles();

            } catch (error) {
                console.error('Error publishing news:', error);
                showNotification('Error publishing news article. Please try again.', 'error');
            }
        });

        // Clear form function
        window.clearForm = function() {
            document.getElementById('newsForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('newsDate').value = today;
        };

        // Load news articles
        async function loadNewsArticles() {
            try {
                const q = window.query(window.collection(window.firebaseDB, 'news'), window.orderBy('createdAt', 'desc'));
                const querySnapshot = await window.getDocs(q);

                const newsList = document.getElementById('newsList');
                newsList.innerHTML = '';

                if (querySnapshot.empty) {
                    newsList.innerHTML = '<p>No news articles found.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const news = doc.data();
                    const newsItem = document.createElement('div');
                    newsItem.className = 'news-item';

                    newsItem.innerHTML = `
                        <h3>${news.title}</h3>
                        <div class="news-meta">
                            <strong>Date:</strong> ${news.date} |
                            <strong>Created:</strong> ${news.createdAt ? new Date(news.createdAt.toDate()).toLocaleDateString() : 'N/A'}
                        </div>
                        <p><strong>Excerpt:</strong> ${news.excerpt}</p>
                        <div class="news-actions">
                            <button class="btn btn-primary" onclick="editNews('${doc.id}')">Edit</button>
                            <button class="btn btn-danger" onclick="deleteNews('${doc.id}')">Delete</button>
                        </div>
                    `;

                    newsList.appendChild(newsItem);
                });

            } catch (error) {
                console.error('Error loading news:', error);
                showNotification('Error loading news articles.', 'error');
            }
        }

        // Edit news function
        window.editNews = function(newsId) {
            // For now, just show a message. In a full implementation, this would open an edit modal
            showNotification('Edit functionality will be implemented soon. News ID: ' + newsId, 'info');
        };

        // Delete news function
        window.deleteNews = async function(newsId) {
            if (!confirm('Are you sure you want to delete this news article?')) {
                return;
            }

            try {
                await window.deleteDoc(window.doc(window.firebaseDB, 'news', newsId));
                showNotification('News article deleted successfully!', 'success');
                loadNewsArticles();
            } catch (error) {
                console.error('Error deleting news:', error);
                showNotification('Error deleting news article. Please try again.', 'error');
            }
        };

        // Notification system
        function showNotification(message, type = 'info', title = '') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: white;
                border-radius: 8px;
                padding: 15px 20px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
                z-index: 9999;
                max-width: 350px;
                transform: translateX(100%);
                opacity: 0;
                transition: all 0.3s ease;
            `;

            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-exclamation-circle';
            if (type === 'warning') icon = 'fa-exclamation-triangle';

            notification.innerHTML = `
                <div style="display: flex; align-items: center;">
                    <div style="margin-right: 15px; font-size: 1.5rem;">
                        <i class="fas ${icon}" style="color: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : type === 'warning' ? '#ffc107' : '#17a2b8'}"></i>
                    </div>
                    <div style="flex-grow: 1;">
                        ${title ? `<div style="font-weight: 600; margin-bottom: 5px;">${title}</div>` : ''}
                        <div>${message}</div>
                    </div>
                    <button style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #6c757d; margin-left: 10px;" onclick="this.parentElement.parentElement.remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            document.body.appendChild(notification);

            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
                notification.style.opacity = '1';
            }, 10);

            // Auto remove after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.style.transform = 'translateX(100%)';
                    notification.style.opacity = '0';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            notification.parentNode.removeChild(notification);
                        }
                    }, 300);
                }
            }, 5000);
        }

        // Logout functionality
        document.querySelector('.logout-btn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await window.signOut(window.firebaseAuth);
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('Error signing out:', error);
                    // Fallback: redirect anyway
                    window.location.href = 'index.html';
                }
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('newsDate').value = today;
        });
    </script>
</body>
</html>
